spring.application.name=bookwise

# ---------------------------------------------------------------------------
# Database - H2 in FILE mode (not in-memory) so that seeded data, borrowings
# created through the UI and the H2 console screenshots all agree with each
# other and survive a restart.
# H2 console JDBC URL to type in the browser: jdbc:h2:file:./data/bookwise
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/bookwise
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# JPA / Hibernate
# open-in-view is disabled deliberately: the persistence context must not stay
# open into the view layer. Every query a template needs is fetched explicitly
# in the repository (fetch joins) or mapped to a DTO in the service.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# Let the GlobalExceptionHandler render 404s rather than the default
# whitelabel page, so "book not found" reaches a friendly view.
# ---------------------------------------------------------------------------
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false
