<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catalogue')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h1 class="h3 mb-1">Library catalogue</h1>
            <p class="text-muted mb-0">Search by title, author or category.</p>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: ruleBanner(${eligibility})}"></div>

    <form th:action="@{/books}" method="get" class="row g-2 mb-4">
        <div class="col-md-8">
            <input type="text" name="q" class="form-control"
                   placeholder="Search title, author or category"
                   th:value="${query}">
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
        <div class="col-md-2 d-grid">
            <a class="btn btn-outline-secondary" th:href="@{/books}">Clear</a>
        </div>
    </form>

    <div th:if="${query != null and !query.isBlank()}" class="mb-3 text-muted">
        <span th:text="${#lists.size(books)} + ' result(s) for &quot;' + ${query} + '&quot;'"></span>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
        <div class="col" th:each="book : ${books}">
            <div class="card card-book">
                <div class="card-body d-flex flex-column">

                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge text-bg-secondary" th:text="${book.format()}">Printed Book</span>
                        <span class="badge"
                              th:classappend="${book.available()} ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${book.available()}
                                       ? ${book.availableCopies()} + ' available'
                                       : 'All copies on loan'">status</span>
                    </div>

                    <h2 class="h5 card-title" th:text="${book.title()}">Title</h2>
                    <p class="text-muted mb-1" th:text="${book.author()}">Author</p>
                    <p class="small text-muted mb-3">
                        <span th:text="${book.category()}">Category</span>
                        &middot; ISBN <span th:text="${book.isbn()}">ISBN</span>
                    </p>

                    <div class="mt-auto">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/books/{id}(id=${book.id()})}">View details</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(books)}" class="alert alert-light border text-center py-5">
        <h2 class="h5">No books matched your search</h2>
        <p class="text-muted mb-0">Try a different title, author or category.</p>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
